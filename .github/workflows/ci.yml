name: CI Verify

on:
  push:
    branches: [main, phase-2]
    tags: ['phase-*', 'v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Contract v1.1 & Phase 2 Tests
        run: npm test

      - name: Syntax check core, headless, server and 3D client
        run: |
          node --check src/tuning.js
          node --check src/terrain.js
          node --check src/sim.js
          node --check src/nights/index.js
          node --check src/nights/n1.js
          node --check src/nights/n2.js
          node --check src/nights/n3.js
          node --check src/entities/shade.js
          node --check src/entities/drifter.js
          node --check headless.js
          node --check server.js
          node --check public/audio.js
          node --check public/assets.js
          node --check public/main.js

      - name: Verify greedy bot wins Night 1 (v1.1 tuning)
        run: node scripts/bot.mjs 1
